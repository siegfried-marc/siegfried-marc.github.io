        // --- NEW ADAPTIVE HERO MEDIA / SLIDESHOW ENGINE ---
        const mediaContainer = document.getElementById('hero-media-container');

        if (Array.isArray(project.heroMedia)) {
            // 1. Render the slideshow structure with an absolute container and navigation dots
            mediaContainer.innerHTML = `
                <div class="relative w-full h-full overflow-hidden group">
                    <div id="hero-slides-wrapper" class="flex w-full h-full transition-transform duration-700 ease-out">
                        ${project.heroMedia.map(slide => `
                            <div class="w-full h-full shrink-0">
                                <img src="${slide.src}" class="w-full h-full object-cover" alt="Project Slide">
                            </div>
                        `).join('')}
                    </div>
                    
                    <!-- Navigation Dots -->
                    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2 z-10 bg-black/20 backdrop-blur-xs px-3 py-1.5 rounded-full">
                        ${project.heroMedia.map((_, index) => `
                            <button class="slide-dot w-2 h-2 rounded-full bg-white/40 transition-all duration-300" data-slide="${index}"></button>
                        `).join('')}
                    </div>
                </div>
            `;

            // 2. Slideshow Mechanics
            let currentSlide = 0;
            const slidesWrapper = document.getElementById('hero-slides-wrapper');
            const dots = document.querySelectorAll('.slide-dot');
            const totalSlides = project.heroMedia.length;

            function goToSlide(index) {
                currentSlide = index;
                // Shift slides horizontally
                slidesWrapper.style.transform = `translateX(-${currentSlide * 100}%)`;
                
                // Update dots visual state
                dots.forEach((dot, idx) => {
                    if (idx === currentSlide) {
                        dot.classList.add('bg-white', 'w-4');
                        dot.classList.remove('bg-white/40');
                    } else {
                        dot.classList.remove('bg-white', 'w-4');
                        dot.classList.add('bg-white/40');
                    }
                });
            }

            // Connect dots click events
            dots.forEach(dot => {
                dot.addEventListener('click', (e) => {
                    const targetIndex = parseInt(e.target.getAttribute('data-slide'));
                    goToSlide(targetIndex);
                });
            });

            // Optional: Auto-play every 4 seconds
            setInterval(() => {
                let nextSlide = (currentSlide + 1) % totalSlides;
                goToSlide(nextSlide);
            }, 4000);

            // Initialize the first active dot look
            goToSlide(0);

        } else {
            // Fallback: Keep original behavior intact for all other projects
            if (project.heroMedia.type === 'video') {
                mediaContainer.innerHTML = `<video src="${project.heroMedia.src}" class="w-full h-full object-cover" autoplay loop muted playsinline></video>`;
            } else {
                mediaContainer.innerHTML = `<img src="${project.heroMedia.src}" class="w-full h-full object-cover" alt="Project Asset">`;
            }
        }

        const midGridContainer = document.getElementById('mid-grid-container');
        const targetMediaArray = project.gridMedia || project.gridImages;

        if (midGridContainer && targetMediaArray) {
            midGridContainer.innerHTML = targetMediaArray.map(item => {
                if (typeof item === 'object' && item.type === 'video') {
                    return `
                        <div class="aspect-square bg-gray-50 border border-gray-200 overflow-hidden relative">
                            <video src="${item.src}" class="w-full h-full object-cover" autoplay loop muted playsinline></video>
                        </div>
                    `;
                } else {
                    const imgSrc = typeof item === 'object' ? item.src : item;
                    
                    if (imgSrc.endsWith('.mp4') || imgSrc.endsWith('.webm')) {
                        return `
                            <div class="aspect-square bg-gray-50 border border-gray-200 overflow-hidden relative">
                                <video src="${imgSrc}" class="w-full h-full object-cover" autoplay loop muted playsinline></video>
                            </div>
                        `;
                    }
                    return `
                        <div class="aspect-square bg-gray-50 border border-gray-200 overflow-hidden relative group">
                            <img src="${imgSrc}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" alt="Process Step">
                        </div>
                    `;
                }
            }).join('');
        }

        // Expanded Panoramic Injection Handler supporting both formats
        const panoramicContainer = document.getElementById('panoramic-container');
        if (panoramicContainer && project.bannerImg) {
            const bannerPath = typeof project.bannerImg === 'object' ? project.bannerImg.src : project.bannerImg;
            const isBannerVideo = (typeof project.bannerImg === 'object' && project.bannerImg.type === 'video') || 
                                  bannerPath.endsWith('.mp4') || 
                                  bannerPath.endsWith('.webm');

            if (isBannerVideo) {
                panoramicContainer.innerHTML = `<video src="${bannerPath}" class="w-full h-full object-cover" autoplay loop muted playsinline></video>`;
            } else {
                panoramicContainer.innerHTML = `<img src="${bannerPath}" class="w-full h-full object-cover" alt="Banner Process Asset">`;
            }
        }

        // Run Initial Build Execution
        renderProject(currentLang);

        // --- Translation Click Mechanics ---
        const btnEn = document.getElementById('lang-en');
        const btnDe = document.getElementById('lang-de');

        function updateToggleStyles(lang) {
            if (lang === 'de') {
                btnDe.classList.add('bg-white', 'text-black');
                btnEn.classList.remove('bg-white', 'text-black');
            } else {
                btnEn.classList.add('bg-white', 'text-black');
                btnDe.classList.remove('bg-white', 'text-black');
            }
        }

        btnEn.addEventListener('click', () => { currentLang = 'en'; renderProject('en'); updateToggleStyles('en'); });
        btnDe.addEventListener('click', () => { currentLang = 'de'; renderProject('de'); updateToggleStyles('de'); });

        // --- Smooth Scrolling & Cursor Engines ---
        const lenis = new Lenis();
        function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);

        const cursorDot = document.querySelector('.cursor-dot');
        const cursorOutline = document.querySelector('.cursor-outline');
        let mouseX = 0, mouseY = 0, cursorX = 0, cursorY = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX; mouseY = e.clientY;
            gsap.set(cursorDot, { x: mouseX, y: mouseY });
        });

        function animateCursor() {
            cursorX += (mouseX - cursorX) * 0.2;
            cursorY += (mouseY - cursorY) * 0.2;
            if(cursorOutline) {
                cursorOutline.style.left = cursorX + "px";
                cursorOutline.style.top = cursorY + "px";
            }
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        gsap.registerPlugin(ScrollTrigger);
        document.querySelectorAll('[data-detail-gsap="fade-up"]').forEach((element) => {
            gsap.fromTo(element, { opacity: 0, y: 40 }, { 
                opacity: 1, y: 0, duration: 1, ease: "power3.out",
                scrollTrigger: { trigger: element, start: "top 85%", toggleActions: "play none none none" }
            });
        });
    </script>
</body>
</html>
